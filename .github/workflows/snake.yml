name: Neon contribution snake

on:
  schedule:
    - cron: "17 0 * * *"   # daily
  workflow_dispatch:        # run manually from the Actions tab
  push:
    branches: [main]
    paths-ignore: ["assets/snake.svg", "assets/snake-light.svg"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#ff003c&color_dots=#1a0b2e,#0b4f5c,#00a6b3,#00d4e6,#00f0ff
            dist/snake-light.svg?palette=github-light&color_snake=#d10038&color_dots=#ebedf0,#b2f0f8,#5cd6e8,#00a3c4,#007f99

      # Save the snake inside the repo (assets/snake.svg) so the README loads it
      # from the same place as every other image. This works in the GitHub mobile app too.
      - name: Commit snake into assets/
        run: |
          mkdir -p assets
          cp dist/snake.svg assets/snake.svg
          cp dist/snake-light.svg assets/snake-light.svg
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg assets/snake-light.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update contribution snake [skip ci]"
          git push
